<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Wiring accessories">
  <defs>
    <linearGradient id="wa-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef3fa"/>
      <stop offset="100%" stop-color="#c7d8ee"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="18" fill="url(#wa-bg)"/>
  <!-- Junction box -->
  <rect x="50" y="60" width="100" height="80" rx="6" fill="#1e4d8c"/>
  <rect x="58" y="68" width="84" height="64" rx="3" fill="#163c6e"/>
  <!-- Cable glands -->
  <circle cx="50" cy="80"  r="8" fill="#0b1f3d"/>
  <circle cx="50" cy="120" r="8" fill="#0b1f3d"/>
  <circle cx="150" cy="80" r="8" fill="#0b1f3d"/>
  <circle cx="150" cy="120" r="8" fill="#0b1f3d"/>
  <!-- Cables -->
  <path d="M30 80 Q40 80 42 80" stroke="#ffd83a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M30 120 Q40 120 42 120" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M158 80 Q170 80 178 80" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M158 120 Q170 120 178 120" stroke="#3b82f6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Screws -->
  <circle cx="56" cy="66" r="2" fill="#ffd83a"/>
  <circle cx="144" cy="66" r="2" fill="#ffd83a"/>
  <circle cx="56" cy="134" r="2" fill="#ffd83a"/>
  <circle cx="144" cy="134" r="2" fill="#ffd83a"/>
  <!-- Label -->
  <rect x="78" y="90" width="44" height="20" rx="3" fill="#ffd83a"/>
  <rect x="84" y="96" width="32" height="3" rx="1" fill="#0b1f3d"/>
  <rect x="84" y="102" width="22" height="3" rx="1" fill="#0b1f3d"/>
</svg>
