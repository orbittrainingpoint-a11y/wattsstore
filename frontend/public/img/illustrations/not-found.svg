<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="404 illustration">
  <defs>
    <linearGradient id="nf-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#eef3fa"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="400" height="280" rx="14" fill="url(#nf-bg)"/>
  <g stroke="#1e4d8c" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
  </g>
  <!-- Plug with disconnected cable -->
  <g transform="translate(110 100)">
    <rect x="-30" y="-25" width="60" height="50" rx="8" fill="#1e4d8c"/>
    <rect x="-22" y="-18" width="44" height="36" rx="4" fill="#0b1f3d"/>
    <circle cx="-10" cy="0" r="4" fill="#ffd83a"/>
    <circle cx="10" cy="0" r="4" fill="#ffd83a"/>
    <path d="M-30 0 L-60 0" stroke="#0b1f3d" stroke-width="6" stroke-linecap="round"/>
    <!-- frayed -->
    <path d="M-60 0 L-78 -8" stroke="#0b1f3d" stroke-width="3" stroke-linecap="round"/>
    <path d="M-60 0 L-78 8" stroke="#FF9933" stroke-width="3" stroke-linecap="round"/>
    <path d="M-60 0 L-76 0" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Outlet -->
  <g transform="translate(290 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#1e4d8c"/>
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#ffffff"/>
    <rect x="-10" y="-12" width="4" height="14" fill="#0b1f3d"/>
    <rect x="6" y="-12" width="4" height="14" fill="#0b1f3d"/>
    <circle cx="0" cy="10" r="3" fill="#0b1f3d"/>
  </g>
  <!-- Spark -->
  <g transform="translate(195 100)">
    <path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#ffd83a" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -16 L0 16 M-16 0 L16 0" stroke="#ffd83a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 404 text -->
  <text x="200" y="220" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="#1e4d8c" text-anchor="middle" letter-spacing="6">404</text>
  <text x="200" y="248" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="700" fill="#3C4859" text-anchor="middle" letter-spacing="3">DISCONNECTED</text>
</svg>
