<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Industrial lighting">
  <defs>
    <linearGradient id="il-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#f5c400"/>
    </linearGradient>
    <radialGradient id="il-glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#fffbe5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffbe5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="18" fill="url(#il-bg)"/>
  <circle cx="100" cy="80" r="60" fill="url(#il-glow)"/>
  <!-- Lamp body -->
  <path d="M70 50 L130 50 L122 95 L78 95 Z" fill="#1e4d8c"/>
  <rect x="86" y="40" width="28" height="10" rx="2" fill="#0b1f3d"/>
  <rect x="94" y="30" width="12" height="12" rx="2" fill="#0b1f3d"/>
  <!-- LED ring -->
  <ellipse cx="100" cy="95" rx="22" ry="6" fill="#0b1f3d"/>
  <ellipse cx="100" cy="93" rx="20" ry="4" fill="#ffd83a"/>
  <!-- Beams -->
  <path d="M80 95 L60 160 L140 160 L120 95 Z" fill="#ffd83a" fill-opacity="0.45"/>
  <path d="M88 95 L78 160 L122 160 L112 95 Z" fill="#fffbe5" fill-opacity="0.65"/>
  <!-- Specks -->
  <circle cx="60" cy="135" r="2" fill="#fffbe5"/>
  <circle cx="140" cy="148" r="2" fill="#fffbe5"/>
  <circle cx="100" cy="170" r="2" fill="#fffbe5"/>
</svg>
