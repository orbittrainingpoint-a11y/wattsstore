<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Product image">
  <defs>
    <linearGradient id="p1-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef3fa"/>
      <stop offset="100%" stop-color="#fff7d6"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#p1-bg)"/>
  <!-- Grid -->
  <g stroke="#1e4d8c" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
  </g>
  <circle cx="200" cy="250" r="180" fill="url(#p1-glow)"/>
  <!-- Industrial luminaire silhouette -->
  <g transform="translate(200 250)">
    <rect x="-90" y="-90" width="180" height="120" rx="10" fill="#1e4d8c"/>
    <rect x="-78" y="-78" width="156" height="96" rx="6" fill="#163c6e"/>
    <!-- LED dots -->
    <g fill="#ffd83a">
      <circle cx="-50" cy="-50" r="6"/>
      <circle cx="-20" cy="-50" r="6"/>
      <circle cx="10" cy="-50" r="6"/>
      <circle cx="40" cy="-50" r="6"/>
      <circle cx="-50" cy="-20" r="6"/>
      <circle cx="-20" cy="-20" r="6"/>
      <circle cx="10" cy="-20" r="6"/>
      <circle cx="40" cy="-20" r="6"/>
      <circle cx="-50" cy="10" r="6"/>
      <circle cx="-20" cy="10" r="6"/>
      <circle cx="10" cy="10" r="6"/>
      <circle cx="40" cy="10" r="6"/>
    </g>
    <!-- Mount -->
    <rect x="-20" y="30" width="40" height="20" fill="#0b1f3d"/>
    <rect x="-8" y="50" width="16" height="40" fill="#0b1f3d"/>
    <!-- Beam wash -->
    <path d="M-95 35 L-150 200 L150 200 L95 35 Z" fill="#ffd83a" fill-opacity="0.18"/>
  </g>
  <!-- Watermark -->
  <text x="200" y="470" font-family="Arial" font-size="10" font-weight="bold" fill="#1e4d8c" fill-opacity="0.35" text-anchor="middle" letter-spacing="3">WATTSSTORE · CATALOG</text>
</svg>
