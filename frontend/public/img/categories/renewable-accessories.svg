<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Renewable energy accessories">
  <defs>
    <linearGradient id="ra-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="18" fill="url(#ra-bg)"/>
  <!-- Battery body -->
  <rect x="40" y="60" width="120" height="100" rx="6" fill="#1e4d8c"/>
  <rect x="48" y="68" width="104" height="84" rx="3" fill="#fff"/>
  <!-- Battery terminals -->
  <rect x="60" y="50" width="22" height="14" rx="2" fill="#0b1f3d"/>
  <rect x="118" y="50" width="22" height="14" rx="2" fill="#0b1f3d"/>
  <text x="71" y="62" font-family="Arial" font-size="10" font-weight="bold" fill="#ffd83a" text-anchor="middle">+</text>
  <text x="129" y="62" font-family="Arial" font-size="10" font-weight="bold" fill="#ffd83a" text-anchor="middle">−</text>
  <!-- Bars (charge level) -->
  <rect x="56" y="76"  width="92" height="10" rx="2" fill="#10b981"/>
  <rect x="56" y="90"  width="92" height="10" rx="2" fill="#10b981"/>
  <rect x="56" y="104" width="92" height="10" rx="2" fill="#10b981"/>
  <rect x="56" y="118" width="92" height="10" rx="2" fill="#ffd83a"/>
  <rect x="56" y="132" width="92" height="10" rx="2" fill="#e5e7eb"/>
  <!-- Leaf accent -->
  <path d="M100 30 Q80 50 100 70 Q120 50 100 30 Z" fill="#10b981"/>
  <line x1="100" y1="30" x2="100" y2="70" stroke="#065f46" stroke-width="2"/>
</svg>
