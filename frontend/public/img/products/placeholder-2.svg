<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Solar panel">
  <defs>
    <linearGradient id="p2-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7e0"/>
      <stop offset="100%" stop-color="#ffe0a3"/>
    </linearGradient>
    <linearGradient id="p2-panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5c"/>
      <stop offset="100%" stop-color="#0b1f3d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#p2-bg)"/>
  <!-- Sun -->
  <circle cx="320" cy="120" r="40" fill="#ffd83a" opacity="0.8"/>
  <g stroke="#ffd83a" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="320" y1="60" x2="320" y2="75"/>
    <line x1="360" y1="70" x2="350" y2="82"/>
    <line x1="380" y1="120" x2="370" y2="120"/>
    <line x1="360" y1="170" x2="350" y2="158"/>
    <line x1="270" y1="170" x2="280" y2="158"/>
  </g>
  <!-- Panel cells (4x6) -->
  <g transform="translate(70 200) skewX(-8)">
    <rect width="240" height="160" fill="url(#p2-panel)" stroke="#0b1f3d" stroke-width="2"/>
    <g stroke="#4cc9f0" stroke-opacity="0.35">
      <line x1="60"  y1="0" x2="60"  y2="160"/>
      <line x1="120" y1="0" x2="120" y2="160"/>
      <line x1="180" y1="0" x2="180" y2="160"/>
      <line x1="0" y1="40"  x2="240" y2="40"/>
      <line x1="0" y1="80"  x2="240" y2="80"/>
      <line x1="0" y1="120" x2="240" y2="120"/>
    </g>
  </g>
  <!-- Mount foot -->
  <rect x="100" y="380" width="10" height="40" fill="#0b1f3d"/>
  <rect x="290" y="380" width="10" height="40" fill="#0b1f3d"/>
  <text x="200" y="470" font-family="Arial" font-size="10" font-weight="bold" fill="#0b1f3d" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">WATTSSTORE · CATALOG</text>
</svg>
