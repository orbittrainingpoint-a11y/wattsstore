<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Power and control">
  <defs>
    <linearGradient id="pc-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="18" fill="url(#pc-bg)"/>
  <!-- Distribution board -->
  <rect x="40" y="36" width="120" height="128" rx="6" fill="#1e4d8c"/>
  <rect x="48" y="44" width="104" height="112" rx="3" fill="#fff"/>
  <!-- DIN rails -->
  <rect x="48" y="64"  width="104" height="4" fill="#cbd5e1"/>
  <rect x="48" y="100" width="104" height="4" fill="#cbd5e1"/>
  <rect x="48" y="136" width="104" height="4" fill="#cbd5e1"/>
  <!-- MCBs row 1 -->
  <g fill="#0b1f3d">
    <rect x="54" y="70" width="10" height="22" rx="1"/>
    <rect x="66" y="70" width="10" height="22" rx="1"/>
    <rect x="78" y="70" width="10" height="22" rx="1"/>
    <rect x="90" y="70" width="10" height="22" rx="1"/>
    <rect x="102" y="70" width="10" height="22" rx="1"/>
    <rect x="114" y="70" width="10" height="22" rx="1"/>
    <rect x="126" y="70" width="10" height="22" rx="1"/>
    <rect x="138" y="70" width="10" height="22" rx="1"/>
  </g>
  <!-- toggles -->
  <g fill="#ffd83a">
    <rect x="56" y="74" width="6" height="4"/>
    <rect x="68" y="78" width="6" height="4"/>
    <rect x="80" y="74" width="6" height="4"/>
    <rect x="92" y="74" width="6" height="4"/>
    <rect x="104" y="78" width="6" height="4"/>
    <rect x="116" y="74" width="6" height="4"/>
    <rect x="128" y="74" width="6" height="4"/>
    <rect x="140" y="78" width="6" height="4"/>
  </g>
  <!-- MCBs row 2 -->
  <g fill="#0b1f3d">
    <rect x="54" y="106" width="10" height="22" rx="1"/>
    <rect x="66" y="106" width="10" height="22" rx="1"/>
    <rect x="78" y="106" width="10" height="22" rx="1"/>
    <rect x="90" y="106" width="10" height="22" rx="1"/>
  </g>
  <g fill="#ef4444">
