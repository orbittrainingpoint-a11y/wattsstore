# WattsStore — NGINX virtual host (production reference).
# GeoIP2 country detection, SSL termination, reverse proxy to Next.js + Express API.
# Load `ngx_http_geoip2_module` and define the geoip2 block in nginx.conf (see nginx.conf).

upstream nextjs_cluster {
    least_conn;
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
    keepalive 32;
}

upstream api_cluster {
    least_conn;
    server 127.0.0.1:4000;
    server 127.0.0.1:4001;
    server 127.0.0.1:4002;
    server 127.0.0.1:4003;
    keepalive 32;
}

server {
    listen 80;
    server_name wattsstore.com www.wattsstore.com;
    return 301 https://$host$request_uri;   # Force HTTPS
}

server {
    listen 443 ssl http2;
    server_name wattsstore.com www.wattsstore.com;

    ssl_certificate     /etc/letsencrypt/live/wattsstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattsstore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (Helmet covers app responses; these cover all responses)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 55m;   # allow 50MB PDF datasheet uploads

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;

    # Raw body passthrough for payment webhooks (signature verification needs raw body)
    location /api/v1/webhooks/ {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Geo-Country-Code $geoip2_country_code;
        proxy_buffering off;
    }

    # API → Express.js
    location /api/ {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Geo-Country-Code $geoip2_country_code;
    }

    # Aggressive static asset caching (content-hashed)
    location /_next/static/ {
        proxy_pass http://nextjs_cluster;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Geo-Country-Code $geoip2_country_code;
    }
}
