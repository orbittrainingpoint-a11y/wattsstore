# WattsStore — NGINX main config (production reference).
# Requires the GeoIP2 dynamic module + MaxMind GeoLite2-Country.mmdb.

load_module modules/ngx_http_geoip2_module.so;

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # GeoIP2: map client IP → ISO country code, exposed as $geoip2_country_code
    geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
        $geoip2_country_code country iso_code;
    }

    log_format main '$remote_addr - $geoip2_country_code [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    include /etc/nginx/sites/*.conf;
}
